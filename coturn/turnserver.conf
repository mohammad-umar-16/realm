# coturn config using time-limited REST API credentials (see backend/src/routes/turn.ts) —
# no static username/password stored anywhere; each client gets a short-lived HMAC credential.
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

fingerprint
lt-cred-mech
use-auth-secret
# must match TURN_SECRET in backend/.env exactly — generate with: openssl rand -hex 32
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET

realm=video-translate.local
# external-ip=YOUR.PUBLIC.IP.HERE   # required in production behind NAT

no-cli
no-tlsv1
no-tlsv1_1
